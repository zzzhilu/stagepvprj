<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>StagePV Favicon - Spotlight</title>
  <!-- Spotlight beam -->
  <polygon points="32,8 14,52 50,52" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Stage floor -->
  <line x1="8" y1="52" x2="56" y2="52" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <!-- Light source dot -->
  <circle cx="32" cy="8" r="4" fill="#000"/>
  <!-- Stage glow line -->
  <line x1="22" y1="46" x2="42" y2="46" stroke="#000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
