<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>StagePV Favicon - Curtain</title>
  <!-- Outer frame (proscenium arch) -->
  <rect x="6" y="6" width="52" height="52" rx="3" fill="none" stroke="#000" stroke-width="3"/>
  <!-- Left curtain -->
  <path d="M6,6 Q18,32 6,58" fill="none" stroke="#000" stroke-width="2.5"/>
  <path d="M6,6 L6,58" stroke="#000" stroke-width="3"/>
  <line x1="6" y1="6" x2="18" y2="12" stroke="#000" stroke-width="2"/>
  <line x1="6" y1="58" x2="18" y2="52" stroke="#000" stroke-width="2"/>
  <!-- Right curtain -->
  <path d="M58,6 Q46,32 58,58" fill="none" stroke="#000" stroke-width="2.5"/>
  <path d="M58,6 L58,58" stroke="#000" stroke-width="3"/>
  <line x1="58" y1="6" x2="46" y2="12" stroke="#000" stroke-width="2"/>
  <line x1="58" y1="58" x2="46" y2="52" stroke="#000" stroke-width="2"/>
  <!-- Play triangle (preview) in center -->
  <polygon points="27,22 27,42 43,32" fill="#000"/>
</svg>
